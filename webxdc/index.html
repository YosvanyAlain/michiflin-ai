<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Michiflin AI</title>
<style>
html,body { margin:0; background:#faf9f6; color:#1b3034; }
@media(prefers-color-scheme:dark){html,body{background:#121c24;color:#eaf1ee}}
#boot-mark{position:fixed;inset:0;z-index:2147483000;display:grid;place-content:center;justify-items:center;gap:14px;background:#faf9f6;color:#1b3034;font:600 15px system-ui;pointer-events:auto;color-scheme:only light}
html[data-boot-theme="dark"] #boot-mark{background:#121c24;color:#eaf1ee;color-scheme:only dark}
#boot-mark svg{width:46px;height:46px;stroke:#198b78;fill:none;stroke-width:1.8}
#boot-mark .boot-track{width:72px;height:3px;border-radius:3px;background:#7a8b8c33;overflow:hidden}
#boot-mark .boot-track:after{content:"";display:block;width:30px;height:3px;border-radius:3px;background:#198b78;animation:boot-glide 1s ease-in-out infinite alternate}
@keyframes boot-glide{to{transform:translateX(42px)}}
@media(prefers-reduced-motion:reduce){#boot-mark .boot-track:after{animation:none;width:100%}}
</style>
<script>
(function(){
  var theme="system";
  try{theme=JSON.parse(localStorage.getItem("mf.prefs")||"{}").theme||"system";}catch(_){}
  var dark=theme==="dark"||(theme==="system"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-boot-theme",dark?"dark":"light");
})();
</script>
<link rel="stylesheet" href="app.css">
<script>
// Independent, ES5 recovery: also works when a later script cannot be parsed.
(function () {
  function report() {
    if (window.__michiflinBootReady) return;
    var node = document.getElementById("startup-recovery");
    if (!node) return;
    var language = (navigator.language || "en").toLowerCase();
    try { var pref = JSON.parse(localStorage.getItem("mf.prefs") || "{}");
      if (pref && (pref.lang === "es" || pref.lang === "en")) language = pref.lang;
    } catch (_) {}
    var es = language.indexOf("es") === 0;
    node.querySelector("h2").textContent = es ? "No se pudo iniciar la miniapp" : "The miniapp could not start";
    node.querySelector("p").textContent = es ? "Tus datos se conservaron. Cierra esta vista y escribe /app en el chat privado para pedir una copia nueva. Si sigue igual, actualiza Android System WebView y Delta Chat. Código: inicio-local." : "Your data was kept. Close this view and type /app in the private chat for a fresh copy. If this continues, update your system WebView and Delta Chat. Code: local-startup.";
    node.hidden = false;
    var boot = document.getElementById("boot-mark"); if (boot) boot.remove();
    var app=document.getElementById("app");if(app)app.inert=false;
  }
  window.addEventListener("load", function () { setTimeout(report, 1500); });
  // A blocked messenger script can prevent the load event indefinitely.
  // This independent watchdog still offers local recovery without mail I/O.
  setTimeout(report, 8000);
})();
</script>
</head>
<body>
<div id="boot-mark" aria-label="Michiflin AI" role="status"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.4 6.6L21 12l-6.6 2.4L12 21l-2.4-6.6L3 12l6.6-2.4z"/></svg><span>Michiflin AI</span><i class="boot-track"></i></div>
<script>
requestAnimationFrame(function(){window.__michiflinPaintStart=Date.now();});
</script>
<div id="app" class="shell" inert>
  <nav id="rail" class="rail"></nav>
  <div class="stage">
    <header class="top">
      <button id="back" class="icon-btn" hidden></button>
      <h1 id="title"></h1>
      <span id="activity" class="activity" hidden></span>
      <button id="notifications-toggle" class="icon-btn notification-toggle" aria-label="Notificaciones" aria-haspopup="dialog" aria-expanded="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><i class="notification-count" hidden></i></button>
      <button id="gear" class="icon-btn"></button>
    </header>
    <section id="startup-recovery" hidden role="alert" style="padding:20px;overflow:auto">
      <h2></h2><p></p>
    </section>
    <main id="view"></main>
  </div>
  <nav id="tabs" class="tabs"></nav>
</div>
<div id="sheet" class="sheet" hidden></div>
<div id="toasts" class="toasts"></div>
<script src="webxdc.js"></script>
<script src="i18n.js"></script>
<script src="core.js"></script>
<script src="qr.js"></script>
<script src="mp4.js"></script>
<script src="brands.js"></script>
<script src="filekit-store.js"></script>
<script src="vendor/noble/filekit-crypto.js"></script>
<script src="filekit-join.js"></script>
<script src="filekit.js"></script>
<script src="utilities.js"></script>
<script src="book-original.js"></script>
<script src="books.js"></script>
<script src="app.js"></script>
<script src="notifications.js"></script>
<script src="live.js"></script>
<script src="coder.js"></script>
</body>
</html>
