name: Read-only state credential permission inspection

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Only a read-only permission inspection"
        type: choice
        options: [diagnostic]
        default: diagnostic

permissions:
  contents: read

jobs:
  permissions-inspection:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'diagnostic'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect existing credential access without mutation
        shell: bash
        env:
          STATE_TOKEN: ${{ secrets.STATE_GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, sys
          from urllib.error import HTTPError
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          token = os.environ.pop('STATE_TOKEN', '')
          if not token:
              print('SAFE_PERMISSIONS_ABORTED missing_state_credential')
              raise SystemExit(1)
          opener = build_opener(NoRedirect())
          def get(path):
              request = Request('https://api.github.com' + path, headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              }, method='GET')
              with opener.open(request, timeout=30) as response:
                  body = response.read(2_000_001)
                  if len(body) > 2_000_000:
                      raise ValueError('response_too_large')
                  return json.loads(body), response.headers
          try:
              user, headers = get('/user')
              scopes = {item.strip() for item in headers.get('X-OAuth-Scopes', '').split(',') if item.strip()}
              state, _ = get('/repos/YosvanyAlain/michiflin-private-state')
              perms = state.get('permissions') or {}
              if state.get('private') is not True or not isinstance(perms, dict):
                  raise ValueError('private_repo_or_role_unavailable')
              state_actions, _ = get('/repos/YosvanyAlain/michiflin-private-state/actions/runs?status=in_progress&per_page=1')
              next_actions, _ = get('/repos/YosvanyAlain/michiflin-ai-next/actions/runs?status=in_progress&per_page=1')
              release, _ = get('/repos/YosvanyAlain/michiflin-private-state/releases/tags/michiflin-state-releases-v1')
              result = {
                  'private_state_repo_visible': True,
                  'repository_reports_pull': bool(perms.get('pull')),
                  'repository_reports_push': bool(perms.get('push')),
                  'repository_reports_admin': bool(perms.get('admin')),
                  'oauth_scope_header_present': bool(scopes),
                  'classic_repo_scope_present': 'repo' in scopes,
                  'state_actions_readable': isinstance(state_actions.get('total_count'), int),
                  'next_actions_readable': isinstance(next_actions.get('total_count'), int),
                  'state_release_readable': isinstance(release.get('id'), int),
                  'write_test_attempted': False,
              }
              print('SAFE_PERMISSIONS_RESULT ' + json.dumps(result, sort_keys=True))
              if not (result['repository_reports_pull'] and result['repository_reports_push']
                      and result['state_actions_readable'] and result['next_actions_readable']
                      and result['state_release_readable']):
                  raise ValueError('required_access_unconfirmed')
          except HTTPError as exc:
              print('SAFE_PERMISSIONS_ABORTED http_' + str(exc.code))
              raise SystemExit(1) from None
          except Exception as exc:
              print('SAFE_PERMISSIONS_ABORTED ' + type(exc).__name__)
              raise SystemExit(1) from None
          PY
