name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CONFIG_DIR: /tmp/michiflin-test/config
      JOB_DIR: /tmp/michiflin-test/jobs
      PREVIEW_DIR: /tmp/michiflin-test/tmp
      FREE_GATEWAYS: "0"
      AI_HORDE: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install test toolchains
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential ffmpeg default-jdk-headless socat iproute2 util-linux gnupg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff pytest

      - name: Build the pinned selective RAR reader
        run: |
          python tools/build_unrar_native.py --output "$RUNNER_TEMP/michiflin-unrar/libunrar.so"
          echo "MICHIFLIN_UNRAR_LIB=$RUNNER_TEMP/michiflin-unrar/libunrar.so" >> "$GITHUB_ENV"

      - name: Install Playwright Chromium and WebKit
        run: python -m playwright install --with-deps chromium webkit

      - name: Logic and isolated-language tests
        run: |
          python -m unittest discover -s tests -p test_logic.py -v
          python -m unittest tests.test_safety -v
          python -m unittest discover -s tests -p test_new_features.py -v
          python -m unittest discover -s tests -p test_ai_music.py -v
          python -m unittest tests.test_backup_maintenance -v
          python -m unittest tests.test_social_accounts -v
          python -m unittest tests.test_personal_maintenance -v
          python -m unittest tests.test_operational_maintenance -v
          python -m unittest tests.test_owner_delivery -v
          python -m pytest -q tests/test_5_1_features.py tests/test_relay_migration.py tests/test_cutover_identity.py tests/test_eltoque_safe.py tests/test_rates_monitor.py tests/test_individual_guest.py tests/test_identity_isolation.py tests/test_verified_identity_guard.py tests/test_email_key_recovery.py tests/test_read_receipts.py tests/test_profile_carryover.py tests/test_owner_history_export.py tests/test_retire_legacy_identity.py tests/test_app_delivery.py tests/test_invite_community.py tests/test_invite_resources.py tests/test_invite_community_ui.py
          MICHIFLIN_SANDBOX_TESTS=1 python -m unittest tests.test_web_session tests.test_proxy_gateway -v

      - name: Translation resilience
        run: python -m unittest tests.test_translation_fallback -v

      - name: WebXDC behavior and package tests
        run: python tests/test_webxdc.py

      - name: WebXDC browser smoke test
        run: |
          python -m unittest tests.test_webxdc_browser -v
          python -m pytest -q tests/test_5_1_browser.py tests/test_offline_owner_data.py

      - name: File kit, encrypted bridge and isolated archive worker
        env:
          MICHIFLIN_WEBKIT_TESTS: "1"
          MICHIFLIN_SANDBOX_TESTS: "1"
        run: |
          python -m unittest tests.test_filekit tests.test_filekit_api tests.test_filekit_join_remote tests.test_filekit_intake tests.test_filekit_transfer tests.test_filekit_delivery -v
          python -m unittest tests.test_filekit_store tests.test_filekit_crypto tests.test_filekit_archive tests.test_filekit_remote_archive tests.test_filekit_rar_native tests.test_filekit_ui tests.test_translation_ui -v

      - name: Static checks
        run: |
          ruff check michiflin state_backup.py bot.py tools/build_manual.py tools/cutover_identity_once.py tools/profile_carryover_once.py tools/export_owner_history_once.py tools/restore_owner_history.py tools/retire_legacy_identity_once.py .github/scripts/trim_action_logs.py .github/scripts/deliver_owner_documents.py tests/test_logic.py tests/test_safety.py tests/test_new_features.py tests/test_ai_music.py tests/test_backup_maintenance.py tests/test_social_accounts.py tests/test_personal_maintenance.py tests/test_operational_maintenance.py tests/test_owner_delivery.py tests/test_web_session.py tests/test_proxy_gateway.py tests/test_webxdc_browser.py tests/test_read_receipts.py tests/test_profile_carryover.py tests/test_owner_history_export.py tests/test_retire_legacy_identity.py tests/test_app_delivery.py tests/test_translation_fallback.py tests/test_translation_ui.py tests/test_email_key_recovery.py tests/test_invite_community.py tests/test_invite_resources.py tests/test_invite_community_ui.py tests/test_filekit*.py --select F,E9
          python -m compileall -q michiflin state_backup.py bot.py tools/build_manual.py tools/cutover_identity_once.py tools/profile_carryover_once.py tools/export_owner_history_once.py tools/restore_owner_history.py tools/retire_legacy_identity_once.py .github/scripts/trim_action_logs.py .github/scripts/deliver_owner_documents.py tests/test_logic.py tests/test_safety.py tests/test_new_features.py tests/test_ai_music.py tests/test_backup_maintenance.py tests/test_social_accounts.py tests/test_personal_maintenance.py tests/test_operational_maintenance.py tests/test_owner_delivery.py tests/test_web_session.py tests/test_proxy_gateway.py tests/test_webxdc_browser.py tests/test_read_receipts.py tests/test_profile_carryover.py tests/test_owner_history_export.py tests/test_retire_legacy_identity.py tests/test_app_delivery.py tests/test_translation_fallback.py tests/test_translation_ui.py tests/test_email_key_recovery.py tests/test_invite_community.py tests/test_invite_resources.py tests/test_invite_community_ui.py tests/test_filekit*.py
          node tests/coder_history.js
          node tests/live_web.js
          for file in webxdc/*.js; do node --check "$file"; done
          git diff --check
