name: Validate next private recovery
"on":
  workflow_dispatch:
    inputs:
      use_warp:
        description: Explicitly route public sources through a verified local WARP proxy
        type: boolean
        default: true
        required: true
      verify_cached_restart:
        description: Block bulk catalogue transfer to verify the authenticated restart cache
        type: boolean
        default: false
        required: true
      check_sources:
        description: Test actual public sources after the authenticated recovery check
        type: boolean
        default: true
        required: true
permissions:
  contents: read
concurrency:
  group: michiflin-offline-recovery-validation
  cancel-in-progress: false
jobs:
  validate-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
      MICHIFLIN_DEPLOY_REVISION: 55cddb1406ddeabc6f7eb61a88bd60adee4f068e
      MICHIFLIN_DEPLOY_CONFIG: ${{ secrets.NEXT_RUNTIME_CONFIG }}
      MICHIFLIN_BACKUP_PASSPHRASE: ${{ secrets.NEXT_BACKUP_PASSPHRASE }}
      MICHIFLIN_BACKUP_TOKEN: ${{ secrets.STATE_GITHUB_TOKEN }}
      MICHIFLIN_BACKUP_REPOSITORY: ${{ secrets.STATE_BACKUP_REPO }}
      MICHIFLIN_SEED_ASSET_ID: '772513826'
      MICHIFLIN_SEED_SHA256: ff11ffc6bacdbe6112647906182956b7c707d733ca01d9acde69972dec763681
      MICHIFLIN_LAUNCH_REVISION: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: YosvanyAlain/michiflin-ai-next
          ref: 55cddb1406ddeabc6f7eb61a88bd60adee4f068e
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install reviewed recovery dependencies
        run: python -m pip install -e '.[bot]'
      - name: Set up explicitly selected public-source WARP proxy
        if: inputs.use_warp
        timeout-minutes: 5
        run: bash tools/setup_warp.sh
      - name: Authenticate identity and catalogue recovery without mail IO
        env:
          PRIVATE_VALIDATION_DIRECTORY: ${{ runner.temp }}/michiflin-offline-recovery
          VERIFY_CACHED_RESTART: ${{ inputs.verify_cached_restart }}
        run: |
          umask 077
          python - <<'PYRECOVERY'
          import json,os,sys,hashlib
          from pathlib import Path
          from michiflin.deployment import execute,PrivateStore
          try:
              feed=Path(os.environ['RUNNER_TEMP'])/'verified-public-feed.csv.gz'
              store=PrivateStore(os.environ['MICHIFLIN_BACKUP_REPOSITORY'],os.environ['MICHIFLIN_BACKUP_TOKEN'])
              store.download(772482566,feed,maximum=8*1024*1024)
              assert hashlib.sha256(feed.read_bytes()).hexdigest()=='66847ed72335833379699bd2c3d0ae1c1180521c43d405a7ab9b28e28e1afd8e'
              os.utime(feed,(1795190933,1795190933))
              verify_restart=os.environ.get('VERIFY_CACHED_RESTART')=='true'
              bulk_attempts=[]
              if verify_restart:
                  from michiflin import gutenberg
                  original_fetch=gutenberg.fetch
                  def no_bulk_transfer(url,**kwargs):
                      if url==gutenberg.FEED:
                          bulk_attempts.append(url)
                          raise RuntimeError('Restart must use its authenticated catalogue cache')
                      return original_fetch(url,**kwargs)
                  gutenberg.fetch=no_bulk_transfer
              result=execute(validate_only=True,duration=60,directory=Path(os.environ['PRIVATE_VALIDATION_DIRECTORY']),source=Path('miniapp'),prepare_catalog=True,catalog_feed=None if verify_restart else feed)
              assert not bulk_attempts
              checkpoint=result['checkpoint']
              assert result['validated'] is True and result['io_started'] is False
              assert checkpoint['catalog_bytes']==5602458
              summary={key:checkpoint[key] for key in ['asset_id','sha256','revision','catalog_bytes']}
              summary.update(io_started=False,catalog_origin='restored_authenticated_snapshot' if verify_restart else 'authenticated_public_feed',restart_bulk_transfers=len(bulk_attempts),bulk_transfer_blocked=verify_restart,catalog_fetched_at=1795190933)
              print('RECOVERY_VALIDATION_SUMMARY '+json.dumps(summary),flush=True)
          except Exception as error:
              print('RECOVERY_VALIDATION_FAILED '+type(error).__name__,flush=True)
              sys.exit(1)
          PYRECOVERY
      - name: Check live public sources independently of recovery
        id: sources
        if: inputs.check_sources
        continue-on-error: true
        timeout-minutes: 4
        run: |
          timeout 180s python - <<'PYSOURCES'
          import json,os
          from pathlib import Path
          from michiflin.gutenberg import GutenbergClient
          from michiflin.diagnostics import check_sources,check_download,check_reader,check_media
          client=GutenbergClient(Path(os.environ['RUNNER_TEMP'])/'public-catalogue-verification')
          client.import_feed(Path(os.environ['RUNNER_TEMP'])/'verified-public-feed.csv.gz')
          results=check_sources(catalog_client=client)
          results.update(gutenberg_epub=check_download(),web_reader=check_reader(),youtube_metadata=check_media())
          print(json.dumps(results,indent=2),flush=True)
          if not all(value['ok'] for value in results.values()):raise SystemExit(1)
          PYSOURCES
      - name: Preserve only encrypted rescue snapshots after failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: next-validation-encrypted-rescue-${{ github.run_id }}
          path: ${{ runner.temp }}/michiflin-offline-recovery/recovery/*.snapshot
          if-no-files-found: ignore
          retention-days: 14
      - name: Disconnect the explicitly selected source proxy
        if: always() && inputs.use_warp
        run: warp-cli --accept-tos disconnect || true
      - name: Keep failed source probes visible as a failed validation
        if: inputs.check_sources && steps.sources.outcome != 'success'
        run: exit 1
