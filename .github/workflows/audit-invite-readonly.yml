name: Read-only invitation audit
on:
  push:
    branches: [audit-invitacion-segura-20261107]
permissions:
  contents: read
jobs:
  metadata-only:
    if: ${{ false }} # One-time audit finished; never re-create temporary capsules on a later push.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.31,<3' 'cryptography>=44,<47' pynacl
      - name: Prepare a private encrypted capsule for the sealed production identity
        env:
          STATE_TOKEN: ${{ secrets.STATE_GITHUB_TOKEN }}
          STATE_REPO: ${{ secrets.STATE_BACKUP_REPO }}
          STATE_PASSPHRASE: ${{ secrets.CLEAN_BACKUP_PASSPHRASE }}
          CLEAN_IDENTITY_EPOCH: ${{ vars.CLEAN_IDENTITY_EPOCH }}
          OWNER_ADDRESS: ${{ secrets.OWNER_ADDRESS }}
          CAPSULE_PUBLIC_KEY: 73YL5sWMIvsfsEJcjnahYiILfv0Scix9NC6Qp1wlEgU=
        run: python .github/scripts/audit_invite_tokens_readonly.py
