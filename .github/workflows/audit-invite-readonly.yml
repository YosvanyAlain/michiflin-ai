name: Read-only invitation audit
on:
  push:
    branches: [audit-invitacion-segura-20261107]
permissions:
  contents: read
jobs:
  metadata-only:
    if: ${{ false }} # One-time identity audit completed.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.31,<3' 'cryptography>=44,<47'
      - name: Compare identity and invitation commitments in memory
        env:
          STATE_TOKEN: ${{ secrets.STATE_GITHUB_TOKEN }}
          STATE_REPO: ${{ secrets.STATE_BACKUP_REPO }}
          STATE_PASSPHRASE: ${{ secrets.CLEAN_BACKUP_PASSPHRASE }}
          IDENTITY_COMMITMENT: ${{ secrets.MICHIFLIN_IDENTITY_AUDIT_COMMITMENT }}
        run: python .github/scripts/audit_invite_tokens_readonly.py
