name: Prepare private next configuration
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: next-private-preparation
  cancel-in-progress: false
jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install envelope cryptography
        run: python -m pip install 'cryptography>=44,<47'
      - name: Seal selected existing configuration
        env:
          MIGRATION_PUBLIC_KEY: 
          MIGRATE_BAZAARLINK_API_KEY: ${{ secrets.BAZAARLINK_API_KEY }}
          MIGRATE_CLEAN_BACKUP_PASSPHRASE: ${{ secrets.CLEAN_BACKUP_PASSPHRASE }}
          MIGRATE_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MIGRATE_CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          MIGRATE_ELTOQUE_API_TOKEN: ${{ secrets.ELTOQUE_API_TOKEN }}
          MIGRATE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MIGRATE_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MIGRATE_HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MIGRATE_MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MIGRATE_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MIGRATE_ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
          MIGRATE_POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          MIGRATE_STATE_BACKUP_PASSPHRASE: ${{ secrets.STATE_BACKUP_PASSPHRASE }}
          MIGRATE_STATE_BACKUP_REPO: ${{ secrets.STATE_BACKUP_REPO }}
          MIGRATE_YDC_API_KEY: ${{ secrets.YDC_API_KEY }}
          MIGRATE_ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          python - <<'PYSEAL'
          import base64,json,os
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          public=serialization.load_pem_public_key(base64.b64decode(os.environ['MIGRATION_PUBLIC_KEY']))
          key=os.urandom(32);nonce=os.urandom(12)
          values={k.removeprefix('MIGRATE_'):v for k,v in os.environ.items() if k.startswith('MIGRATE_')}
          cipher=AESGCM(key).encrypt(nonce,json.dumps(values).encode(),b'michiflin-next-private-migration-v1')
          wrapped=public.encrypt(key,padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          envelope={k:base64.b64encode(v).decode() for k,v in {'key':wrapped,'nonce':nonce,'ciphertext':cipher}.items()}
          Path('migration.sealed').write_text(json.dumps(envelope))
          print('Private configuration sealed. No bot or mail IO was started.')
          PYSEAL
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: next-private-migration
          path: migration.sealed
          retention-days: 1
          if-no-files-found: error
