name: Agent and challenge safety (isolated test)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONFIG_DIR: /tmp/michiflin-focused/config
      JOB_DIR: /tmp/michiflin-focused/jobs
      PREVIEW_DIR: /tmp/michiflin-focused/tmp
      FREE_GATEWAYS: '0'
      AI_HORDE: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install project tests
        run: pip install -r requirements.txt pytest ruff
      - name: Offline correctness and regressions
        run: |
          python -m pytest -q tests/test_local_gguf.py tests/test_youtube_challenge_safe.py tests/test_5_1_features.py tests/test_new_features.py tests/test_logic.py
          python tests/test_webxdc.py
          ruff check michiflin/agent.py michiflin/local_ai.py michiflin/smart_agent.py michiflin/tools.py michiflin/media.py tests/test_local_gguf.py tests/test_youtube_challenge_safe.py --select F,E9
