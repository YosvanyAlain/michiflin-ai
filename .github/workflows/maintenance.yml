name: WARP egress trace (isolated test)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install Cloudflare WARP on this test runner
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -qq --yes cloudflare-warp
      - name: Verify only Cloudflare trace
        shell: bash
        run: |
          set -euo pipefail
          warp-cli --accept-tos registration new >/dev/null
          warp-cli --accept-tos mode proxy >/dev/null
          warp-cli --accept-tos proxy port 40000 >/dev/null
          warp-cli --accept-tos connect >/dev/null
          for i in $(seq 1 15); do
            if curl -s --max-time 5 --socks5-hostname 127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -q '^warp=on$'; then
              echo 'SAFE_WARP_TEST_TRACE warp=on'
              exit 0
            fi
            sleep 2
          done
          echo 'SAFE_WARP_TEST_TRACE unverified'
          exit 1
