name: Read-only recovery inspection

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instabox-readonly-recovery
  cancel-in-progress: false

jobs:
  inspect-encrypted-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install recovery dependencies
        run: python3 -m pip install --quiet 'requests==2.33.0' 'cryptography==46.0.7'
      - name: Restore the legacy snapshot without starting a bot
        env:
          OWNER_ADDRESS: ${{ secrets.OWNER_ADDRESS }}
          OWNER_BACKUP_ADDRESS: ${{ secrets.OWNER_BACKUP_ADDRESS }}
          OWNER_NOTICE: ${{ secrets.OWNER_NOTICE }}
          BOT_EPOCH: ${{ secrets.BOT_EPOCH }}
          BAZAARLINK_API_KEY: ${{ secrets.BAZAARLINK_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          ELTOQUE_API_TOKEN: ${{ secrets.ELTOQUE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MICHIFLIN_GITHUB_TOKEN: ${{ secrets.MICHIFLIN_GITHUB_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          YDC_API_KEY: ${{ secrets.YDC_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          WEB_SESSION_KEY: ${{ secrets.WEB_SESSION_KEY }}
          STATE_BACKUP_REPO: ${{ secrets.STATE_BACKUP_REPO }}
          STATE_BACKUP_PASSPHRASE: ${{ secrets.STATE_BACKUP_PASSPHRASE }}
          STATE_GITHUB_TOKEN: ${{ secrets.STATE_GITHUB_TOKEN }}
          MIGRATION_EXPORT_PASSPHRASE: ${{ secrets.MIGRATION_EXPORT_PASSPHRASE }}
          MIGRATION_UPLOAD_URL: ${{ secrets.MIGRATION_UPLOAD_URL }}
          OWNER_ONLY: ${{ vars.OWNER_ONLY || '1' }}
          INVITE_AUTO_ACCESS: ${{ vars.INVITE_AUTO_ACCESS || '0' }}
          EMAIL_KEY_RECOVERY: ${{ vars.EMAIL_KEY_RECOVERY || '0' }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$RUNNER_TEMP/migration-key" "$RUNNER_TEMP/migration-export.tar.gpg"; rm -rf "$RUNNER_TEMP/migration-readonly"' EXIT
          python3 .github/scripts/instabox_legacy_export.py
