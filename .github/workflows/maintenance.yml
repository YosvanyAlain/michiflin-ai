name: Diagnostic artifact visibility test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artifact-test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Create harmless diagnostic
        run: echo SAFE_ARTIFACT_PROBE > "$RUNNER_TEMP/safe-probe.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: harmless-gguf-diagnostic
          path: ${{ runner.temp }}/safe-probe.txt
          retention-days: 1
      - name: Keep test session open
        run: sleep 90
