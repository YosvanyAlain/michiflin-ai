name: Technical maintenance

on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: michiflin-technical-maintenance
  cancel-in-progress: false

jobs:
  old-action-logs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Remove only older diagnostic logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/trim_action_logs.py
