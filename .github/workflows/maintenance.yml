name: Private recovery check without restore

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install verification libraries
        run: python -m pip install --quiet 'requests==2.33.0' 'cryptography==46.0.3'
      - name: Check without restoring or revealing private material
        env:
          STATE_GITHUB_TOKEN: ${{ secrets.STATE_GITHUB_TOKEN }}
          STATE_BACKUP_REPO: ${{ secrets.STATE_BACKUP_REPO }}
          OLD_PASSWORD: ${{ secrets.STATE_BACKUP_PASSPHRASE }}
          CLEAN_PASSWORD: ${{ secrets.CLEAN_BACKUP_PASSPHRASE }}
        run: python tools/audit_candidate_memory_only.py
