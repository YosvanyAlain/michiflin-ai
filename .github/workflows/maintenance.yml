name: Seal clean recovery instructions

on:
  workflow_dispatch:

permissions: {}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install verification libraries
        run: python -m pip install --quiet 'requests==2.33.0' 'cryptography==46.0.3'
      - name: Check clean copies and seal instructions without restoring
        env:
          STATE_GITHUB_TOKEN: ${{ secrets.STATE_GITHUB_TOKEN }}
          STATE_BACKUP_REPO: ${{ secrets.STATE_BACKUP_REPO }}
          CLEAN_PASSWORD: ${{ secrets.CLEAN_BACKUP_PASSPHRASE }}
          CLEAN_EPOCH: ${{ vars.CLEAN_IDENTITY_EPOCH }}
        run: python tools/seal_clean_recovery_plan.py
