name: Isolated local AI security probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check dedicated user, process isolation and limits
        run: bash tools/gguf_sandbox_probe.sh
