name: Read-only invitation verification
on:
  workflow_dispatch:
    inputs:
      pair_digest:
        description: "SHA-256 of the two random invitation tokens, not the invitation"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: invitation-audit-only
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install 'cryptography>=44,<47' 'requests>=2.31,<3'
      - name: Compare only invitation tokens in memory
        env:
          GITHUB_TOKEN: ${{ secrets.STATE_GITHUB_TOKEN }}
          STATE_BACKUP_REPO: ${{ secrets.STATE_BACKUP_REPO }}
          STATE_BACKUP_PASSPHRASE: ${{ secrets.CLEAN_BACKUP_PASSPHRASE }}
          EXPECTED_PAIR_DIGEST: ${{ inputs.pair_digest }}
        run: python tools/audit_invite_tokens.py
