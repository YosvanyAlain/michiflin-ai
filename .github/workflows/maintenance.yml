name: Local GGUF benchmark (isolated test)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Synthetic bounded CPU benchmark
        run: bash tools/eval_gguf_benchmark.sh
