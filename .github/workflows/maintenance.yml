name: Local GGUF integration (isolated test)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      CONFIG_DIR: /tmp/michiflin-integration/config
      JOB_DIR: /tmp/michiflin-integration/jobs
      PREVIEW_DIR: /tmp/michiflin-integration/tmp
      FREE_GATEWAYS: '0'
      AI_HORDE: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install project test dependencies
        run: pip install -r requirements.txt pytest
      - name: Offline agent and security tests
        run: python -m pytest -q tests/test_local_gguf.py tests/test_5_1_features.py tests/test_new_features.py
      - name: Isolated synthetic integration with local model
        run: bash tools/gguf_eval/live_integration.sh
