name: Michiflin next private sessions
on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Session mode; validation never starts mail IO
        type: choice
        options: [validate-only, run]
        default: validate-only
        required: true
      check_sources:
        description: Explicitly recheck live source reachability
        type: boolean
        default: false
        required: false
      seconds:
        description: Bounded session duration in seconds
        type: choice
        options: ['60', '19200']
        default: '60'
        required: true
permissions:
  contents: read
concurrency:
  group: michiflin-session
  cancel-in-progress: false
jobs:
  private-session:
    if: github.event_name == 'workflow_dispatch' || vars.NEXT_LAUNCH_REVISION == 'b5aa011fee2eee1180ac1597dce5d42d016e15d9'
    runs-on: ubuntu-24.04
    timeout-minutes: 358
    env:
      PYTHONUNBUFFERED: '1'
      MICHIFLIN_DEPLOY_REVISION: b5aa011fee2eee1180ac1597dce5d42d016e15d9
      MICHIFLIN_LAUNCH_REVISION: ${{ vars.NEXT_LAUNCH_REVISION }}
      MICHIFLIN_DEPLOY_CONFIG: ${{ secrets.NEXT_RUNTIME_CONFIG }}
      MICHIFLIN_BACKUP_PASSPHRASE: ${{ secrets.NEXT_BACKUP_PASSPHRASE }}
      MICHIFLIN_BACKUP_TOKEN: ${{ secrets.STATE_GITHUB_TOKEN }}
      MICHIFLIN_BACKUP_REPOSITORY: ${{ secrets.STATE_BACKUP_REPO }}
      MICHIFLIN_SEED_ASSET_ID: '770164542'
      MICHIFLIN_SEED_SHA256: 107d02269b0d3996e16132658f5871f5ecf4b241c9c7c9eb0d246671e788eb4f
      MICHIFLIN_SESSION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'run' }}
      MICHIFLIN_SESSION_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.seconds || '19200' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: YosvanyAlain/michiflin-ai-next
          ref: b5aa011fee2eee1180ac1597dce5d42d016e15d9
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install reviewed runtime dependencies
        run: python -m pip install -e '.[bot]'
      - name: Check live public sources without sending files
        id: sources
        if: github.event_name == 'workflow_dispatch' && inputs.check_sources
        continue-on-error: true
        timeout-minutes: 4
        run: |
          timeout 180s python - <<'PYSOURCES'
          import tempfile,json,hashlib
          from pathlib import Path
          from michiflin import library,weather,downloads
          from michiflin.identity import Principal
          from michiflin.storage import Ledger
          from michiflin.network import JsonClient
          from michiflin.errors import AppError
          client=JsonClient()
          results={}
          with tempfile.TemporaryDirectory() as temporary:
              root=Path(temporary)
              principal=Principal('source-test@example.invalid','A'*40,1,True,True)
              ledger=Ledger(root/'state');ledger.bind(1,principal.storage_key,1)
              def download():
                  result=downloads.prepare(client,ledger,root/'downloads',principal,1,{'book':1342,'format':'epub'})
                  files=list((root/'downloads').glob('*.epub'));assert len(files)==1
                  return {'verified_epub_bytes':result['bytes'],'sha256':hashlib.sha256(files[0].read_bytes()).hexdigest()}
              checks={
                  'gutenberg_search':lambda: {'books':len(library.search(client,library.BookQuery.parse({'title':'Pride and Prejudice','author':'Austen','format':'epub'}))['books'])},
                  'gutenberg_epub':download,
                  'openlibrary':lambda:{'books':len(library.search(client,library.BookQuery.parse({'source':'openlibrary','title':'Don Quijote','language':'es'}))['books'])},
                  'geocoding':lambda:{'ok':bool(weather.locations(client,'La Habana','es'))},
                  'forecast':lambda:{'ok':bool(weather.forecast(client,23.1136,-82.3666))},
              }
              for name,run in checks.items():
                  try:results[name]={'ok':True,'data':run()}
                  except AppError as error:results[name]={'ok':False,'error':error.code}
                  except Exception:results[name]={'ok':False,'error':'check_failed'}
                  print('SOURCE_CHECK '+json.dumps({name:results[name]}),flush=True)
          print('SOURCE_SUMMARY '+json.dumps(results),flush=True)
          if not all(value['ok'] for value in results.values()):raise SystemExit(1)
          PYSOURCES
      - name: Validate or run the bounded private session
        run: |
          umask 077
          flags=()
          if [ "$MICHIFLIN_SESSION_MODE" = 'validate-only' ]; then
            flags+=(--validate-only)
          elif [ "$MICHIFLIN_SESSION_MODE" != 'run' ]; then
            exit 1
          fi
          python -m michiflin.deployment "${flags[@]}" --duration "$MICHIFLIN_SESSION_SECONDS" --directory "$RUNNER_TEMP/michiflin-next-private" --source "$GITHUB_WORKSPACE/miniapp"
      - name: Preserve only encrypted rescue snapshots after failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: next-encrypted-rescue-${{ github.run_id }}
          path: ${{ runner.temp }}/michiflin-next-private/recovery/*.snapshot
          if-no-files-found: ignore
          retention-days: 14
