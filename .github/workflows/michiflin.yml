name: Live WARP diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-warp-diagnostic
  cancel-in-progress: false

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      WEB_PROXY: socks5://127.0.0.1:40000
      MEDIA_PROXY: socks5://127.0.0.1:40000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install isolated browser dependencies
        run: |
          echo "precedence ::ffff:0:0/96 100" | sudo tee -a /etc/gai.conf > /dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends socat iproute2 util-linux curl gnupg lsb-release
          pip install -r requirements.txt
          python -m playwright install --with-deps --only-shell chromium
      - name: Check runner path without WARP
        run: |
          if curl -sS --max-time 15 https://www.cloudflare.com/cdn-cgi/trace | grep -q '^warp=off$'; then
            echo 'Runner trace: warp=off'
          else
            echo 'Runner direct trace could not be confirmed'
          fi
      - name: Start and verify WARP proxy
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install --yes cloudflare-warp
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect
          for i in $(seq 1 15); do
            if curl -s --max-time 5 --socks5-hostname 127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -q '^warp=on$'; then
              echo 'WARP SOCKS trace: warp=on'
              exit 0
            fi
            sleep 2
          done
          echo 'WARP was not verified; stopping the diagnostic'
          exit 1
      - name: Verify Live sandbox through WARP
        run: PYTHONPATH="$GITHUB_WORKSPACE" python .github/scripts/warp_probe.py
