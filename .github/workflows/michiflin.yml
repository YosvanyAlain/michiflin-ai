name: Michiflin AI

on:
  schedule:
    - cron: "5 */6 * * *"
  workflow_dispatch:
    inputs:
      send_owner_documents:
        description: "Send the requested source ZIP and PDF to the verified owner once"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write
  models: read

concurrency:
  group: michiflin-session
  cancel-in-progress: false

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      CONFIG_DIR: ${{ github.workspace }}/.michiflin-state
      BOT_TIMEZONE: America/Havana
      SESSION_DURATION_SECONDS: "19200"
      # User-authorized, temporary test. Set repository variable to 0 to opt out
      # at the next session. The server uses no provider AI key or account.
      LOCAL_GGUF_TEST_REQUESTED: ${{ vars.LOCAL_GGUF_TEST_REQUESTED || '1' }}
      # Independently opted in by the owner; ignored for everyone else and
      # unless the request is in the current encrypted one-to-one app.
      LOCAL_COLLAB_OWNER: ${{ vars.LOCAL_COLLAB_OWNER || '0' }}
      OWNER_ADDRESS: ${{ secrets.OWNER_ADDRESS }}
      # Explicit backup admin; email-based rekeying is a separately opted-in risk.
      OWNER_BACKUP_ADDRESS: ${{ secrets.OWNER_BACKUP_ADDRESS }}
      EMAIL_KEY_RECOVERY: ${{ vars.EMAIL_KEY_RECOVERY || '0' }}
      # A clean identity is always private, regardless of legacy repo variables.
      OWNER_ONLY: ${{ vars.CLEAN_IDENTITY_EPOCH != '' && '1' || vars.OWNER_ONLY || '1' }}
      INVITE_AUTO_ACCESS: ${{ vars.CLEAN_IDENTITY_EPOCH != '' && '0' || vars.INVITE_AUTO_ACCESS || '0' }}
      PURGE_NON_OWNER_ONCE: ${{ vars.PURGE_NON_OWNER_ONCE }}
      # Optional one-shot request is bound to a single exact revision.
      OWNER_DOCUMENT_DELIVERY_REVISION: ${{ vars.OWNER_DOCUMENT_DELIVERY_REVISION }}
      # One-time migration is also armed only for an exact reviewed commit.
      RELAY_MIGRATION_REVISION: ${{ vars.RELAY_MIGRATION_REVISION }}
      # A separately verified candidate is imported only for an exact reviewed revision.
      IDENTITY_CUTOVER_REVISION: ${{ vars.IDENTITY_CUTOVER_REVISION }}
      # Preserve recoverable old owner content only for the reviewed revision.
      OWNER_HISTORY_EXPORT_REVISION: ${{ vars.OWNER_HISTORY_EXPORT_REVISION }}
      OWNER_HISTORY_EXISTING_ASSET_ID: ${{ vars.OWNER_HISTORY_EXISTING_ASSET_ID }}
      CANDIDATE_BUNDLE_ASSET_ID: ${{ secrets.CANDIDATE_BUNDLE_ASSET_ID }}
      CANDIDATE_BUNDLE_KEY: ${{ secrets.CANDIDATE_BUNDLE_KEY }}
      # The previous root SHA is the stable fallback for existing app instances.
      BOT_EPOCH: ${{ secrets.BOT_EPOCH || 'ba553fe52541ffaaaa85e1b382200cc60fa9b89b' }}
      # Enable only together with a verified fresh-identity cutover; do not strand legacy instances early.
      BOT_EPOCH_STRICT: ${{ vars.BOT_EPOCH_STRICT || '0' }}
      # Off for the existing account; a new identity must pin the owner's verified public key.
      BOT_VERIFIED_CONTACTS_ONLY: ${{ vars.BOT_VERIFIED_CONTACTS_ONLY || '0' }}
      OWNER_PGP_FINGERPRINT: ${{ secrets.OWNER_PGP_FINGERPRINT }}
      MAINTENANCE_MODE: ${{ vars.MAINTENANCE_MODE || '0' }}
      # The fresh identity never inherits a previous contact allow-list,
      # mailbox profile list or proactive notice.
      MAILBOX_PROFILES_JSON: ${{ vars.CLEAN_IDENTITY_EPOCH == '' && secrets.MAILBOX_PROFILES_JSON || '' }}
      OWNER_NOTICE: ${{ vars.CLEAN_IDENTITY_EPOCH == '' && secrets.OWNER_NOTICE || '' }}
      ALLOWED_SENDERS: ${{ vars.CLEAN_IDENTITY_EPOCH == '' && secrets.ALLOWED_SENDERS || '' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN || github.token }}
      LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
      KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
      AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
      BAZAARLINK_API_KEY: ${{ secrets.BAZAARLINK_API_KEY }}
      ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      YDC_API_KEY: ${{ secrets.YDC_API_KEY }}
      EXTRA_PROVIDERS: ${{ secrets.EXTRA_PROVIDERS }}
      AI_EXTRA_ALLOWED_HOSTS: ${{ secrets.AI_EXTRA_ALLOWED_HOSTS }}
      ELTOQUE_API_TOKEN: ${{ secrets.ELTOQUE_API_TOKEN }}
      ELTOQUE_REFRESH_SECONDS: ${{ vars.ELTOQUE_REFRESH_SECONDS || '300' }}
      # Separate Michiflin calculations; never replace the received provider values.
      ELTOQUE_DERIVED_CALCULATIONS: ${{ vars.ELTOQUE_DERIVED_CALCULATIONS || '1' }}
      LIBRETRANSLATE_URL: ${{ vars.LIBRETRANSLATE_URL }}
      LIBRETRANSLATE_API_KEY: ${{ secrets.LIBRETRANSLATE_API_KEY }}
      APERTIUM_URL: ${{ vars.APERTIUM_URL || 'https://beta.apertium.org/apy' }}
      APERTIUM_ENABLED: ${{ vars.APERTIUM_ENABLED || '1' }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
      FACEBOOK_CLIENT_TOKEN: ${{ secrets.FACEBOOK_CLIENT_TOKEN }}
      FACEBOOK_READ_POSTS: ${{ vars.FACEBOOK_READ_POSTS || '0' }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_OAUTH_REDIRECT_URI: ${{ secrets.TIKTOK_OAUTH_REDIRECT_URI }}
      TIKTOK_READ_VIDEOS: ${{ vars.TIKTOK_READ_VIDEOS || '0' }}
      WEB_SESSION_KEY: ${{ secrets.WEB_SESSION_KEY }}
      MICHIFLIN_GITHUB_TOKEN: ${{ secrets.MICHIFLIN_GITHUB_TOKEN }}
      YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
      GITHUB_TOKEN: ${{ secrets.STATE_GITHUB_TOKEN }}
      STATE_BACKUP_REPO: ${{ secrets.STATE_BACKUP_REPO }}
      STATE_BACKUP_REQUIRED: "1"
      STATE_BACKUP_STORAGE: releases
      # Retain a bounded set of verified snapshots; recovery plans and other
      # non-snapshot assets are never targeted by the automatic rotation.
      STATE_BACKUP_RETAIN_ALL: "0"
      STATE_BACKUP_INCLUDE_BLOBS: "1"
      # Normal deployment retains the old native namespace. The new identity
      # switches only after its distinct clean seed has been verified and sealed.
      MICHIFLIN_CLEAN_EPOCH: ${{ vars.CLEAN_IDENTITY_EPOCH }}
      STATE_BACKUP_NAMESPACE: ${{ vars.CLEAN_IDENTITY_EPOCH != '' && 'owner-clean-v1' || 'github-native-v1' }}
      MICHIFLIN_NATIVE_READY_REQUIRED: ${{ vars.CLEAN_IDENTITY_EPOCH != '' && '0' || '1' }}
      MICHIFLIN_NATIVE_FENCE_REQUIRED: ${{ vars.CLEAN_IDENTITY_EPOCH != '' && '0' || '1' }}
      # A clean account has no old queues or maintenance notice to resume.
      MICHIFLIN_GITHUB_RESUME_ONCE: ${{ vars.CLEAN_IDENTITY_EPOCH != '' && '0' || '1' }}
      STATE_BACKUP_PASSPHRASE: ${{ secrets[vars.CLEAN_IDENTITY_EPOCH != '' && 'CLEAN_BACKUP_PASSPHRASE' || 'STATE_BACKUP_PASSPHRASE'] }}
      CHATMAIL_RELAY: nine.testrun.org
      RUNNING_SHA: ${{ github.sha }}
      UPDATE_CHECK_TOKEN: ${{ github.token }}
      RESTART_MARKER: ${{ github.workspace }}/.michiflin-restart
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: |
          echo "precedence ::ffff:0:0/96 100" | sudo tee -a /etc/gai.conf > /dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential ffmpeg p7zip-full socat iproute2 util-linux gnupg xvfb xdotool xclip
          pip install -r requirements.txt
          pip install -U --pre "yt-dlp[default]"
          # Cuba keeps UTC-4 through 2027; the runner image may ship older tzdata.
          python -m pip install "tzdata==2026.6"
          ZONEINFO="$(python -c 'from pathlib import Path; import tzdata; print(Path(tzdata.__file__).parent / "zoneinfo")')"
          echo "PYTHONTZPATH=$ZONEINFO" >> "$GITHUB_ENV"
          PYTHONTZPATH="$ZONEINFO" python -c "from datetime import datetime; from zoneinfo import ZoneInfo; assert int(datetime(2026,11,3,tzinfo=ZoneInfo('America/Havana')).utcoffset().total_seconds()) == -14400"
          echo "PW_VERSION=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_ENV"

      - name: Build the isolated selective RAR reader
        run: |
          if python tools/build_unrar_native.py --output "$RUNNER_TEMP/michiflin-unrar/libunrar.so"; then
            echo "MICHIFLIN_UNRAR_LIB=$RUNNER_TEMP/michiflin-unrar/libunrar.so" >> "$GITHUB_ENV"
          else
            echo "::warning::Selective RAR is unavailable this session; the bot will continue without it."
          fi

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-graphical-${{ runner.os }}-${{ env.PW_VERSION }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ env.PW_VERSION }}

      - name: Install browser
        run: python -m playwright install --with-deps chromium

      - name: Prepare isolated local AI test
        id: gguf_prepare
        if: env.LOCAL_GGUF_TEST_REQUESTED == '1'
        continue-on-error: true
        timeout-minutes: 11
        run: |
          # Keep only fixed safety markers and numeric curl error codes in the
          # optional diagnostic artifact; never upload arbitrary process output.
          set +e
          set -o pipefail
          bash tools/local_gguf_session.sh prepare 2>&1 | tee "$RUNNER_TEMP/gguf-prepare-raw.log"
          result=(${PIPESTATUS[@]})
          {
            grep -E '^SAFE_GGUF_(PREP_[A-Z_]+|ENGINE_DOWNLOAD|MODEL_DOWNLOAD|SERVER_[A-Z_]+)$|^SAFE_GGUF_PREFLIGHT memory_kib=[0-9]+ disk_kib=[0-9]+ cgroup=(max|[0-9]+)$' "$RUNNER_TEMP/gguf-prepare-raw.log" || true
            grep -oE '^curl: \([0-9]+\)|returned error: [0-9]+' "$RUNNER_TEMP/gguf-prepare-raw.log" || true
            echo "SAFE_GGUF_DIAGNOSTIC_EXIT=${result[0]}"
          } > "$RUNNER_TEMP/gguf-prepare-status.log"
          rm -f "$RUNNER_TEMP/gguf-prepare-raw.log"
          if [ "${result[0]}" -ne 0 ] || [ "${result[1]}" -ne 0 ]; then exit 1; fi

      - name: Media egress
        continue-on-error: true
        run: |
          WARP_READY=0
          trap 'if [ "$WARP_READY" != 1 ]; then echo "WARP not verified; no workflow proxy was configured."; fi' EXIT
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install --yes cloudflare-warp
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect
          for i in $(seq 1 15); do
            if curl -s --max-time 5 --socks5-hostname 127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -q "^warp=on$"; then
              echo "MEDIA_PROXY=socks5://127.0.0.1:40000" >> "$GITHUB_ENV"
              WARP_READY=1
              echo "WARP proxy verified for media and Live"
              break
            fi
            sleep 2
          done

      - name: Protect the retained legacy backup namespace
        if: env.STATE_BACKUP_NAMESPACE == 'github-native-v1'
        env:
          MICHIFLIN_ACTIONS_TOKEN: ${{ github.token }}
        run: python tools/github_native_guard.py guard

      - name: Restore state
        run: python state_backup.py restore

      - name: Arm the non-destructive replay fence
        if: env.STATE_BACKUP_NAMESPACE == 'github-native-v1'
        env:
          MICHIFLIN_ACTIONS_TOKEN: ${{ github.token }}
        run: python tools/github_native_guard.py arm

      - name: Import the separately verified identity
        if: ${{ env.STATE_BACKUP_NAMESPACE == 'github-native-v1' && github.repository == 'YosvanyAlain/michiflin-ai' && github.ref == 'refs/heads/main' && env.IDENTITY_CUTOVER_REVISION != '' && env.IDENTITY_CUTOVER_REVISION == github.sha }}
        run: python tools/cutover_identity_once.py cutover

      - name: Enforce identity isolation and prevent downgrade
        if: env.STATE_BACKUP_NAMESPACE == 'github-native-v1'
        run: python tools/cutover_identity_once.py activate

      - name: Verify the separately paired clean identity
        if: env.STATE_BACKUP_NAMESPACE == 'owner-clean-v1'
        run: python tools/clean_owner_identity.py activate

      - name: Initialize account
        run: |
          if [ ! -d "$CONFIG_DIR" ]; then
            if [ "$STATE_BACKUP_NAMESPACE" = "owner-clean-v1" ]; then
              echo "Verified clean state is missing; refusing to create an orphan account."
              exit 1
            fi
            python bot.py --config-dir "$CONFIG_DIR" init "DCACCOUNT:${CHATMAIL_RELAY}"
          fi

      - name: Configure profile
        run: |
          python bot.py --config-dir "$CONFIG_DIR" config displayname "Michiflin AI"
          python bot.py --config-dir "$CONFIG_DIR" config selfavatar "$GITHUB_WORKSPACE/assets/michiflin-avatar.png"

      - name: Preserve the previous profile description once
        if: env.STATE_BACKUP_NAMESPACE == 'github-native-v1'
        run: |
          if ! python tools/profile_carryover_once.py; then
            echo "::warning::Profile description could not be merged; the active account and old recovery copy remain unchanged."
          fi

      - name: Apply profile status
        id: profile_status
        run: |
          if python -m michiflin.profile "$CONFIG_DIR"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Profile status could not be verified; the bot will start anyway."
          fi

      - name: Profile status verified
        if: steps.profile_status.outputs.ready == 'true'
        run: echo "Bot profile status verified"

      - name: Apply authorized one-time cleanup
        id: purge
        if: env.STATE_BACKUP_NAMESPACE == 'github-native-v1' && env.PURGE_NON_OWNER_ONCE == '1'
        shell: bash
        run: |
          set -e
          test "$CONFIG_DIR" = "$GITHUB_WORKSPACE/.michiflin-state"
          cp -a "$CONFIG_DIR" "$RUNNER_TEMP/purge-original"
          if python -m michiflin.purge_users apply "$CONFIG_DIR" "$RUNNER_TEMP/purge-proof.json"; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cleanup failed; restoring original state without removing backups."
            rm -rf -- "$CONFIG_DIR"
            mv "$RUNNER_TEMP/purge-original" "$CONFIG_DIR"
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Preserve recoverable owner history once
        id: owner_history_export
        if: ${{ env.STATE_BACKUP_NAMESPACE == 'github-native-v1' && github.repository == 'YosvanyAlain/michiflin-ai' && github.ref == 'refs/heads/main' && env.OWNER_HISTORY_EXPORT_REVISION != '' && env.OWNER_HISTORY_EXPORT_REVISION == github.sha }}
        run: |
          if python tools/export_owner_history_once.py; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
          else
            echo "verified=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Owner history was not exported; all legacy copies remain untouched."
          fi

      - name: Back up configured account
        run: python state_backup.py save

      - name: Verify backup recovery
        shell: bash
        run: |
          set -e
          CONFIG_DIR="$RUNNER_TEMP/backup-recovery-check" python state_backup.py restore
          rm -rf -- "$RUNNER_TEMP/backup-recovery-check"

      - name: Verify sanitized backup or roll back
        id: purge_verified
        if: steps.purge.outputs.applied == 'true'
        shell: bash
        run: |
          set -e
          test "$CONFIG_DIR" = "$GITHUB_WORKSPACE/.michiflin-state"
          if CONFIG_DIR="$RUNNER_TEMP/purge-check" python state_backup.py restore && \
             python -m michiflin.purge_users verify "$RUNNER_TEMP/purge-check" "$RUNNER_TEMP/purge-proof.json"; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
            # The old deployment allow-list may contain the people just removed.
            # Runtime sharing uses new, individually approved session grants.
            echo "ALLOWED_SENDERS=" >> "$GITHUB_ENV"
            rm -rf -- "$RUNNER_TEMP/purge-original" "$RUNNER_TEMP/purge-check"
          else
            echo "Sanitized backup not verified; restoring original state and retaining old backups."
            rm -rf -- "$CONFIG_DIR" "$RUNNER_TEMP/purge-check"
            mv "$RUNNER_TEMP/purge-original" "$CONFIG_DIR"
            python state_backup.py save
            echo "verified=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for serialized backup history cleanup
        if: steps.purge_verified.outputs.verified == 'true' && env.STATE_BACKUP_STORAGE == 'legacy-git'
        run: python .github/scripts/wait_for_clean_backup.py

      - name: Note retained recovery snapshots after one-time cleanup
        if: steps.purge_verified.outputs.verified == 'true' && env.STATE_BACKUP_STORAGE == 'releases'
        run: echo "The sanitized snapshot was verified; older recovery snapshots remain under the retention policy. Do not claim their immediate erasure."

      # Authorized one-time 5.1 relay change. Armed only when the exact reviewed
      # revision is supplied through the temporary repository variable. The
      # script verifies a recoverable encrypted snapshot, keeps the old transport
      # and refuses automatic retries after an interrupted registration.
      - name: Migrate bot relay with recovery safeguards
        id: relay_migration
        if: ${{ env.STATE_BACKUP_NAMESPACE == 'github-native-v1' && github.repository == 'YosvanyAlain/michiflin-ai' && github.ref == 'refs/heads/main' && env.RELAY_MIGRATION_REVISION != '' && env.RELAY_MIGRATION_REVISION == github.sha }}
        env:
          MICHIFLIN_RELAY_MIGRATE_ONCE: "1"
        run: python tools/migrate_relay_once.py

      - name: Relay migration verified
        if: steps.relay_migration.outputs.verified == 'true'
        run: echo "New relay, preserved identity, encrypted continuity and recovery verified."

      - name: Deliver explicitly requested owner documents
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.send_owner_documents) || (env.STATE_BACKUP_NAMESPACE == 'github-native-v1' && env.OWNER_DOCUMENT_DELIVERY_REVISION != '' && env.OWNER_DOCUMENT_DELIVERY_REVISION == github.sha) }}
        continue-on-error: true
        env:
          CONFIRM_OWNER_DELIVERY: "1"
          EXPECTED_DELIVERY_ADDRESS: ${{ secrets.OWNER_DOCUMENT_RECIPIENT }}
        run: python .github/scripts/deliver_owner_documents.py

      - name: Start isolated local AI test
        id: gguf_start
        if: steps.gguf_prepare.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 4
        run: |
          # Keep only fixed safety markers and numeric curl error codes in the
          # optional diagnostic artifact; never upload arbitrary process output.
          set +e
          set -o pipefail
          bash tools/local_gguf_session.sh start 2>&1 | tee "$RUNNER_TEMP/gguf-start-raw.log"
          result=(${PIPESTATUS[@]})
          {
            grep -E '^SAFE_GGUF_(PREP_[A-Z_]+|ENGINE_DOWNLOAD|MODEL_DOWNLOAD|SERVER_[A-Z_]+)$|^SAFE_GGUF_PREFLIGHT memory_kib=[0-9]+ disk_kib=[0-9]+ cgroup=(max|[0-9]+)$' "$RUNNER_TEMP/gguf-start-raw.log" || true
            grep -oE '^curl: \([0-9]+\)|returned error: [0-9]+' "$RUNNER_TEMP/gguf-start-raw.log" || true
            echo "SAFE_GGUF_DIAGNOSTIC_EXIT=${result[0]}"
          } > "$RUNNER_TEMP/gguf-start-status.log"
          rm -f "$RUNNER_TEMP/gguf-start-raw.log"
          if [ "${result[0]}" -ne 0 ] || [ "${result[1]}" -ne 0 ]; then exit 1; fi

      # Only safe startup diagnostics (no prompts, identity or bot state) are
      # published if startup failed; they remain available while the bot runs.
      - name: Save local AI startup diagnostics
        if: ${{ env.LOCAL_GGUF_TEST_REQUESTED == '1' && (steps.gguf_prepare.outcome == 'failure' || steps.gguf_start.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: local-gguf-startup-diagnostic
          path: ${{ runner.temp }}/gguf-*-status.log
          retention-days: 1
          if-no-files-found: ignore

      - name: Local AI test ready
        if: steps.gguf_start.outcome == 'success'
        run: |
          echo "LOCAL_GGUF_ENABLED=1" >> "$GITHUB_ENV"
          echo "LOCAL_GGUF_ACTIONS_TEST=1" >> "$GITHUB_ENV"
          echo "LOCAL_GGUF_SOCKET_PATH=/run/michiflin-local-gguf/llama.sock" >> "$GITHUB_ENV"
          echo "LOCAL_GGUF_KEY_FILE=$RUNNER_TEMP/michiflin-local-gguf-key" >> "$GITHUB_ENV"
          echo "Local test available, one inference at a time."

      - name: Local AI unavailable; retain normal bot
        if: ${{ env.LOCAL_GGUF_TEST_REQUESTED == '1' && steps.gguf_start.outcome != 'success' }}
        run: |
          bash tools/local_gguf_session.sh stop || true
          echo "LOCAL_GGUF_TEST_UNAVAILABLE=1" >> "$GITHUB_ENV"
          echo "::warning::Local AI was not verified; explicit extractive research remains available."

      - name: Private session
        shell: bash
        run: |
          set +e
          (
            while true; do
              sleep 1800
              python state_backup.py save || echo "Periodic state backup failed."
            done
          ) &
          BACKUP_PID=$!
          STARTED=$(date +%s)
          finish() {
            kill "$BACKUP_PID" 2>/dev/null || true
            wait "$BACKUP_PID" 2>/dev/null || true
            # The bot has stopped; free local inference resources before backup
            # and before the ordinary next-session handover.
            if [ "${LOCAL_GGUF_ENABLED:-0}" = "1" ]; then
              bash tools/local_gguf_session.sh stop || echo "::warning::Local AI cleanup failed."
            fi
            if ! python state_backup.py save; then
              echo "Final encrypted backup failed; automatic handover is stopped."
              return 1
            fi
            echo "SESSION_SECONDS_RUN=$(( $(date +%s) - STARTED ))" >> "$GITHUB_ENV"
            if [ -f "$RESTART_MARKER" ]; then echo "BOT_RESTART=1" >> "$GITHUB_ENV"; fi
          }
          trap 'kill "$BOT_PID" 2>/dev/null; wait "$BOT_PID"; sleep 1; finish; exit 130' INT TERM
          timeout --foreground --signal=TERM --kill-after=150 "$SESSION_DURATION_SECONDS" python bot.py --config-dir "$CONFIG_DIR" serve &
          BOT_PID=$!
          wait "$BOT_PID"
          BOT_EXIT=$?
          trap - INT TERM
          if ! finish; then exit 1; fi
          if [ "$BOT_EXIT" -ne 0 ] && [ "$BOT_EXIT" -ne 124 ]; then
            exit "$BOT_EXIT"
          fi

      - name: Clean temporary local AI test
        if: ${{ always() && env.LOCAL_GGUF_TEST_REQUESTED == '1' }}
        continue-on-error: true
        run: bash tools/local_gguf_session.sh stop

      - name: Next session
        if: "!cancelled() && (env.BOT_RESTART == '1' || (env.SESSION_SECONDS_RUN != '' && env.SESSION_SECONDS_RUN > 1800))"
        env:
          GH_TOKEN: ${{ github.token }}
