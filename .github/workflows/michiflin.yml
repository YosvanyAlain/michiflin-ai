# Disposable staging only. This file exists solely on arena/qa-visual-20261028;
# it must never be merged into main or used as the production workflow.
name: Private web staging

on:
  workflow_dispatch:
    inputs:
      purpose:
        description: 'Run bounded online checks or start a private owner session'
        type: choice
        options: [checks, session, network]
        default: checks
        required: true

permissions:
  contents: read
  models: read

concurrency:
  group: michiflin-private-web-staging-${{ inputs.purpose }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref_name == 'arena/qa-visual-20261028' && inputs.purpose == 'checks'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONFIG_DIR: ${{ github.workspace }}/.coder-check-state
      JOB_DIR: ${{ github.workspace }}/.coder-check-jobs
      PREVIEW_DIR: ${{ github.workspace }}/.coder-check-tmp
      OWNER_ONLY: "1"
      OWNER_ADDRESS: qa-owner@example.invalid
      FREE_GATEWAYS: "0"
      AI_HORDE: "0"
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BAZAARLINK_API_KEY: ${{ secrets.BAZAARLINK_API_KEY }}
      ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends socat iproute2 util-linux
          python -m pip install -r requirements.txt
      - name: Check public search and a real free-tier model
        run: python .github/scripts/staging_preflight.py

  network:
    if: github.ref_name == 'arena/qa-visual-20261028' && inputs.purpose == 'network'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Direct connectivity only
        shell: bash
        run: |
          trace=$(curl --fail --silent --show-error --max-time 20 https://www.cloudflare.com/cdn-cgi/trace | grep '^warp=' || true)
          echo "Direct Cloudflare trace: ${trace:-unavailable}"
      - name: Try optional WARP installation
        id: setup
        continue-on-error: true
        shell: bash
        run: |
          set -e
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list > /dev/null
          sudo apt-get update && sudo apt-get install --yes cloudflare-warp
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect
      - name: Test WARP connectivity, never a social login
        if: always()
        shell: bash
        run: |
          if ! command -v warp-cli >/dev/null; then echo 'WARP client unavailable'; exit 0; fi
          trace=$(curl --fail --silent --show-error --max-time 30 --retry 3 --retry-delay 3 --retry-all-errors --socks5-hostname 127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep '^warp=' || true)
          echo "WARP Cloudflare trace: ${trace:-unavailable}"

  staging:
    if: github.ref_name == 'arena/qa-visual-20261028' && inputs.purpose == 'session'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      CONFIG_DIR: ${{ github.workspace }}/.private-web-test
      JOB_DIR: ${{ github.workspace }}/.private-web-test-jobs
      PREVIEW_DIR: ${{ github.workspace }}/.private-web-test-tmp
      OWNER_ADDRESS: ${{ secrets.OWNER_ADDRESS }}
      OWNER_ONLY: "1"
      MAINTENANCE_MODE: "0"
      BOT_EPOCH: disposable-private-web-staging
      SESSION_DURATION_SECONDS: "5700"
      STATE_BACKUP_REQUIRED: "0"
      FREE_GATEWAYS: "0"
      AI_HORDE: "0"
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BAZAARLINK_API_KEY: ${{ secrets.BAZAARLINK_API_KEY }}
      ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install isolated browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg p7zip-full socat iproute2 util-linux
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps --only-shell chromium
      - name: Check browser isolation
        env:
          MICHIFLIN_SANDBOX_TESTS: "1"
        run: python -m unittest tests.test_web_session.RealSandboxTests -v
      - name: Create disposable private account
        shell: bash
        run: |
          set -e
          umask 077
          test -n "$OWNER_ADDRESS" || { echo 'Owner address is not configured'; exit 1; }
          python - <<'PY'
          import os,secrets
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write('WEB_SESSION_KEY=' + secrets.token_urlsafe(48) + '\n')
          PY
          python bot.py --logging critical --config-dir "$CONFIG_DIR" init 'DCACCOUNT:nine.testrun.org' >"$RUNNER_TEMP/stage-init.log" 2>&1 || { echo 'Could not initialize disposable account'; exit 1; }
          python bot.py --logging critical --config-dir "$CONFIG_DIR" config displayname 'Michiflin · PRUEBA PRIVADA' >"$RUNNER_TEMP/stage-profile.log" 2>&1
      - name: Encrypt private invitation
        run: python .github/scripts/staging_invite.py
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-private-test-invitation
          path: ${{ runner.temp }}/stage-invite.enc
          if-no-files-found: error
          retention-days: 1
      - name: Private test session
        shell: bash
        run: |
          set +e
          umask 077
          rm -f "$RUNNER_TEMP/stage-invite.enc"
          echo 'Private staging is running for the configured owner only; no state backup is enabled.'
          timeout --signal=TERM --kill-after=150 "$SESSION_DURATION_SECONDS" python bot.py --logging critical --config-dir "$CONFIG_DIR" serve >"$RUNNER_TEMP/stage-service.log" 2>&1
          status=$?
          rm -rf -- "$CONFIG_DIR" "$JOB_DIR" "$PREVIEW_DIR"
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then echo 'Private session ended with an error'; exit "$status"; fi
