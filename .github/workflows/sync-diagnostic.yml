name: Read-only sync diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: michiflin-readonly-sync-diagnostic
  cancel-in-progress: false

jobs:
  inspect-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONFIG_DIR: ${{ github.workspace }}/.sync-diagnostic-state
      GITHUB_TOKEN: ${{ secrets.STATE_GITHUB_TOKEN }}
      STATE_BACKUP_REPO: ${{ secrets.STATE_BACKUP_REPO }}
      STATE_BACKUP_REQUIRED: "1"
      STATE_BACKUP_STORAGE: releases
      STATE_BACKUP_INCLUDE_BLOBS: "1"
      MICHIFLIN_CLEAN_EPOCH: ${{ vars.CLEAN_IDENTITY_EPOCH }}
      STATE_BACKUP_NAMESPACE: ${{ vars.CLEAN_IDENTITY_EPOCH != '' && 'owner-clean-v1' || 'github-native-v1' }}
      MICHIFLIN_NATIVE_READY_REQUIRED: ${{ vars.CLEAN_IDENTITY_EPOCH != '' && '0' || '1' }}
      MICHIFLIN_NATIVE_FENCE_REQUIRED: ${{ vars.CLEAN_IDENTITY_EPOCH != '' && '0' || '1' }}
      STATE_BACKUP_PASSPHRASE: ${{ secrets[vars.CLEAN_IDENTITY_EPOCH != '' && 'CLEAN_BACKUP_PASSPHRASE' || 'STATE_BACKUP_PASSPHRASE'] }}
      OWNER_ADDRESS: ${{ secrets.OWNER_ADDRESS }}
      # Match the current runtime generation; old packages remain stored but revoked.
      REVOKE_LEGACY_MINIAPPS: "1"
      MINIAPP_RELEASE: "public-private-20261119-v1"
      SYNC_DIAGNOSTIC_OFFLINE_RPC: "1"
      BOT_EPOCH: ${{ secrets.BOT_EPOCH || 'ba553fe52541ffaaaa85e1b382200cc60fa9b89b' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Dependencies
        run: python -m pip install requests 'cryptography>=50' 'deltachat2==2.58.0' 'deltachat-rpc-server==2.58.0'
      - name: Restore isolated copy only
        run: |
          python - <<'PY'
          import contextlib, os
          from pathlib import Path
          import state_backup
          try:
              with open(Path(os.environ['RUNNER_TEMP']) / 'private-restore.log', 'w') as log:
                  with contextlib.redirect_stdout(log), contextlib.redirect_stderr(log):
                      state_backup.restore()
          except Exception as exc:
              print('RESTORE_FAILED', type(exc).__name__)
              raise SystemExit(1)
          print('ISOLATED_SNAPSHOT_RESTORED_NO_MAIL_IO')
          PY
      - name: Counts and booleans only
        run: python tools/diagnose_invitation_snapshot.py > "$RUNNER_TEMP/sync-diagnostic.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sync-diagnostic-counts
          path: ${{ runner.temp }}/sync-diagnostic.json
          retention-days: 1
          if-no-files-found: error
      - name: Remove isolated private copy
        if: always()
        run: rm -rf "$CONFIG_DIR" "$RUNNER_TEMP/private-restore.log"
