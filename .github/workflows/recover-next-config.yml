name: Recover sealed next runtime configuration
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: next-private-preparation
  cancel-in-progress: false
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: python -m pip install 'cryptography>=44,<47'
      - name: Encrypt private next configuration
        env:
          RECOVERY_PUBLIC_KEY: 
          PRIVATE_CONFIG: ${{ secrets.NEXT_RUNTIME_CONFIG }}
          PRIVATE_PASSPHRASE: ${{ secrets.NEXT_BACKUP_PASSPHRASE }}
        run: |
          python - <<'PYSEAL'
          import os,json,base64
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes,serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          public=serialization.load_pem_public_key(base64.b64decode(os.environ['RECOVERY_PUBLIC_KEY']))
          values={k:os.environ[k] for k in ('PRIVATE_CONFIG','PRIVATE_PASSPHRASE')}
          assert all(values.values())
          key=os.urandom(32);nonce=os.urandom(12)
          cipher=AESGCM(key).encrypt(nonce,json.dumps(values).encode(),b'michiflin-next-recovery-v1')
          wrapped=public.encrypt(key,padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          Path('next-config.sealed').write_text(json.dumps({k:base64.b64encode(v).decode() for k,v in {'key':wrapped,'nonce':nonce,'ciphertext':cipher}.items()}))
          print('Runtime configuration encrypted; no account or mail IO was opened.')
          PYSEAL
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: next-config-recovery
          path: next-config.sealed
          retention-days: 1
          if-no-files-found: error
